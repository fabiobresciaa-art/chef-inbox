services:
  - type: web
    name: chef-inbox
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python tg_inbox_mcp.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_IDS
        sync: false
      - key: INBOX_SECRET
        sync: false
